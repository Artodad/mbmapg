<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MBMA Halloween Carnival Fundraising Goal</title>
<style>
:root{--goal:5000;--raised:950}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 20% 10%,#4a1a6b,#1a0b2e 70%)}
.card{width:min(680px,92vw);padding:36px 32px;border-radius:28px;background:rgba(255,255,255,.07);box-shadow:0 20px 60px rgba(0,0,0,.45);text-align:center}
h1{margin:0 0 4px;font-size:2rem;color:#ffa31a}
.sub{opacity:.8;margin-bottom:26px}
.amount{font-size:3.2rem;font-weight:800}
.amount small{font-size:1.1rem;font-weight:400;opacity:.8}
.track{position:relative;height:46px;border-radius:30px;background:rgba(0,0,0,.4);overflow:hidden;margin:22px 0 10px;border:2px solid rgba(255,255,255,.15)}
.fill{height:100%;width:0;border-radius:30px;background:linear-gradient(90deg,#ff6a00,#ffb300);box-shadow:0 0 24px #ff8c00;transition:width 2.4s cubic-bezier(.2,.8,.2,1);position:relative}
.fill::after{content:"🎃";position:absolute;right:-4px;top:50%;transform:translateY(-50%);font-size:30px}
.marks{display:flex;justify-content:space-between;font-size:.85rem;opacity:.7}
.pct{font-size:1.3rem;margin-top:18px}
.togo{opacity:.85;margin-top:6px}
.ghost{font-size:2.4rem;animation:f 3s ease-in-out infinite}
@keyframes f{50%{transform:translateY(-8px)}}
.thanks{margin-top:22px;font-size:.95rem;opacity:.75}
</style></head><body>
<div class="card">
<div class="ghost">👻</div>
<h1>Halloween Carnival Fundraiser</h1>
<div class="sub">Mission Bay Montessori Academy Parents Group · Carnival Oct 30</div>
<div class="amount">$<span id="raised">0</span> <small>of $5,000</small></div>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="marks"><span>$0</span><span>$1,250</span><span>$2,500</span><span>$3,750</span><span>$5,000</span></div>
<div class="pct" id="pct"></div>
<div class="togo" id="togo"></div>
<div class="thanks">Thank you to every family who has given. 🧡 Donations and sponsorships as of Oct 16, 2026.</div>
</div>
<script>
const GOAL=5000, RAISED=1300;
const p=Math.min(100,RAISED/GOAL*100);
requestAnimationFrame(()=>setTimeout(()=>document.getElementById('fill').style.width=p+'%',200));
let t0=null;
function tick(ts){t0=t0||ts;const k=Math.min(1,(ts-t0)/2400),e=1-Math.pow(1-k,3);
document.getElementById('raised').textContent=Math.round(RAISED*e).toLocaleString();
if(k<1)requestAnimationFrame(tick)}
requestAnimationFrame(tick);
document.getElementById('pct').textContent=p.toFixed(0)+'% of our goal';
document.getElementById('togo').textContent='$'+(GOAL-RAISED).toLocaleString()+' to go';
</script></body></html>
